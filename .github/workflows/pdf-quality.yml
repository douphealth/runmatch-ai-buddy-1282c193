name: PDF and shoe image quality

on:
  push:
    branches:
      - "fix/pdf-verified-shoe-images-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify shoe image audit
        run: npm run audit:shoe-images
      - name: Run tests
        run: npm test
      - name: Generate representative PDF samples
        env:
          PDF_DUMP_DIR: pdf-samples
        run: npx vitest run src/lib/pdf-generator.test.ts
      - name: Upload PDF samples
        uses: actions/upload-artifact@v4
        with:
          name: runmatch-pdf-samples
          path: pdf-samples/*.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Build production app
        run: npm run build
