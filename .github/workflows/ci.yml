name: CI

on:
  pull_request:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  stripe-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Stripe Edge Functions
        run: |
          deno check supabase/functions/stripe-product/index.ts
          deno check supabase/functions/stripe-create-checkout/index.ts
          deno check supabase/functions/stripe-verify-session/index.ts
          deno check supabase/functions/stripe-webhook/index.ts
      - name: Run Stripe contract tests
        run: deno test --allow-env supabase/functions/_shared/runmatch-stripe.test.ts
